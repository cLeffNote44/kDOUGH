name: CI

on:
  push:
    branches: [ main, master, develop ]
  # No branch filter: validate every PR regardless of its target branch so the
  # documented develop/feature-branch flow gets CI signal before merge.
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest

    steps:
    - uses: actions/checkout@v7

    - name: Use Node.js
      uses: actions/setup-node@v4
      with:
        node-version: 20
        cache: 'npm'
        cache-dependency-path: app/package-lock.json

    - name: Install dependencies
      run: cd app && npm ci

    - name: Audit dependencies (high+)
      run: cd app && npm audit --audit-level=high
      continue-on-error: true

    - name: Run lint
      run: cd app && npm run lint

    - name: Typecheck
      run: cd app && npm run typecheck

    - name: Run tests
      run: cd app && npm test

    - name: Build
      run: cd app && npm run build
