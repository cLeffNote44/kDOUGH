version: 2
updates:
  # App dependencies live under /app. Weekly PRs keep transitive security fixes
  # flowing while the committed lockfile keeps installs deterministic.
  - package-ecosystem: "npm"
    directory: "/app"
    schedule:
      interval: "weekly"
    open-pull-requests-limit: 5
    groups:
      dev-dependencies:
        dependency-type: "development"
  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"
